    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a Unique Verification Code (UVC)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A UVC is a unique alphanumeric code embedded in every document signed through Aiyug's signing platform. It allows anyone to verify the authenticity of a signed document without needing an account."
          }
        },
        {
          "@type": "Question",
          "name": "Is Sign IDed free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Document verification through Sign IDed is completely free for anyone. No login or account is required."
          }
        },
        {
          "@type": "Question",
          "name": "Does Sign IDed store my documents?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Sign IDed does not store any uploaded documents. PDFs are processed in memory for verification and immediately discarded. Only the verification metadata (hash, timestamp, signer info) is checked."
          }
        }
      ]
    }
    </script>
